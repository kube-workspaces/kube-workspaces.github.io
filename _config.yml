title: Kube Workspaces
description: Browser-accessible development environments running as pods in your Kubernetes cluster. Open source, no database required.
url: "https://kubeworkspaces.io"

collections:
  docs:
    output: true
    permalink: /docs/:name/

plugins:
  - jekyll-toc

toc:
  min_level: 2
  max_level: 3
  list_id: ''

defaults:
  - scope:
      path: _docs
    values:
      layout: docs